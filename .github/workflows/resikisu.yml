name: resukisu and sus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Get clang toolchain (same as Crave clang-r563880c)
        run: |
          # wget -qO clang.tar.gz "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz"
          wget -qO clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f7de4376c4a749c1dde95c6f55d6c44cda883fce/clang-r487747c.tar.gz"
          tar -xf clang.tar.gz
          rm clang.tar.gz
          echo "=== Setting PATH Variables ==="
          echo "PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH" >> $GITHUB_ENV


      # - name: Get kernel build tools (pahole, dtc, lz4)
      #   run: |
      #     mkdir -p kernel-build-tools
      #     curl -LSs "https://android.googlesource.com/kernel/prebuilts/build-tools/+archive/refs/heads/main/linux-x86.tar.gz" -o kbt.tar.gz
      #     tar -xzf kbt.tar.gz -C kernel-build-tools


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libncurses-dev lz4 ccache
          # sudo apt-get install -y build-essential bc curl git python3 python-is-python3 \
          #   gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev cpio lz4 zip \
          #   make wget ccache
          sudo apt-get install -y build-essential bc curl git python3 python-is-python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev cpio lz4 zip \
          make wget ccache clang lld llvm binutils-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross
    
      # 1. Delete Microsoft, Android, and Java bloatware to free up ~30GB of disk space
      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: true
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: false

      # 2. Now you safely have plenty of room to allocate a massive 20GB Swap file
      # - name: Set up Swap Space
      #   uses: pierotofy/set-swap-space@master
      #   with:
      #     swap-size-gb: 20

      - name: Clone kernel
        run:
          git clone --depth=1 --recurse-submodules https://github.com/Ashr1th/android_kernel_motorola_sm6225 -b luna_susfs_old kernel_workspace
          # git clone --depth 1 --no-checkout https://github.com/LineageOS/android_kernel_motorola_sm6225 kernel_workspace && cd kernel_workspace && git fetch origin 7f2f53c2bb9a4c4dd5cff162b6c62970e6d9b812 && git checkout FETCH_HEAD
          

      - name: Setup resukisu susfs
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          #curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          cat <<EOF >> arch/arm64/configs/vendor/ext_config/devon-default.config

          #
          # KernelSU
          #
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          # CONFIG_KSU_TOOLKIT_SUPPORT is not set
          CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%"
          # CONFIG_KSU_DISABLE_MANAGER is not set
          # CONFIG_KSU_DISABLE_POLICY is not set
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SUSFS=y

          #
          # KernelSU - SUSFS
          #

          #
          # ------------------------WARNING-------------------------------
          #

          #
          # BakaSU will check EVERY hooks in kernel compile process
          #

          #
          # If anything mismatch with simonpunk's patch, Kernel compile maybe FAILED!
          #

          #
          # See simonpunk's original patch if you face any compile failed due to hook check
          #

          #
          # Repo: https://gitlab.com/simonpunk/susfs4ksu
          #

          #
          # --------------------------------------------------------------
          #
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y



          EOF

      - name: Build kernel
        run: |
          # export PATH=$GITHUB_WORKSPACE/clang/toolchain/bin:$GITHUB_WORKSPACE/kernel-build-tools/bin:$PATH
          GCC_LIB=$(dirname "$(aarch64-linux-gnu-gcc -print-libgcc-file-name)")
          SYSROOT=$(aarch64-linux-gnu-gcc -print-sysroot)

          echo "$GCC_LIB"
          echo "$SYSROOT"

          export CLANG_FLAGS="--target=aarch64-linux-gnu --sysroot=$SYSROOT --gcc-install-dir=$GCC_LIB -fintegrated-as -Werror=unknown-warning-option"

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="clang"
          export LD=ld.lld
          export TARGET_BOARD_PLATFORM=bengal
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          cd $GITHUB_WORKSPACE/kernel_workspace

          # ARGS="O=out ARCH=arm64 \
          #       CC=clang \
          #       CROSS_COMPILE=aarch64-none-linux-gnu- \
          #       CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          #       LLVM=1 LLVM_IAS=1"

          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          CLANG_FLAGS="$CLANG_FLAGS" vendor/bengal-perf_defconfig

          scripts/kconfig/merge_config.sh -m -r -O out out/.config arch/arm64/configs/vendor/ext_config/moto-bengal.config arch/arm64/configs/vendor/ext_config/devon-default.config

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          CLANG_FLAGS="$CLANG_FLAGS" olddefconfig

          curl -sSf https://sshx.io/get | sh -s run

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          CLANG_FLAGS="$CLANG_FLAGS"  -j$(nproc)
          # make O=out -j$(nproc) $ARGS

      # - name: Upload build output
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: kernel-output
      #     path: |
      #       kernel_workspace/out/arch/arm64/boot/
      #       kernel_workspace/out/.config

      - name: Package into AnyKernel3 Flashable ZIP
        run: |
          cd $GITHUB_WORKSPACE
          # cd $GITHUB_WORKSPACE/kernel_workspace
          # Clone standard AnyKernel3 template
          git clone --depth=1 https://github.com/MrIceT/anykernel3_wild.git anykernel

          # Copy your freshly compiled Image into the AnyKernel folder
          cp $GITHUB_WORKSPACE/kernel_workspace/out/arch/arm64/boot/Image anykernel/

          # Zip everything up
          cd anykernel

          rm -rf .git

      # - name: Upload build output
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: kernel-output
      #     path: |
      #       kernel_workspace/out/arch/arm64/boot/

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: devon_bakasu_susfs
          path: anykernel/

