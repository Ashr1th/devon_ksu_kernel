name: xxksu Kernel Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Get clang toolchain (same as Crave clang-r563880c)
        run: |
          mkdir -p clang
          wget -qO clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz"
          tar -xzf clang.tar.gz -C clang

      # - name: Get kernel build tools (pahole, dtc, lz4)
      #   run: |
      #     mkdir -p kernel-build-tools
      #     curl -LSs "https://android.googlesource.com/kernel/prebuilts/build-tools/+archive/refs/heads/main/linux-x86.tar.gz" -o kbt.tar.gz
      #     tar -xzf kbt.tar.gz -C kernel-build-tools


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev lz4 ccache

      - name: Checkout Actions Repo
        uses: actions/checkout@v4

      # 1. Delete Microsoft, Android, and Java bloatware to free up ~30GB of disk space
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # 2. Now you safely have plenty of room to allocate a massive 20GB Swap file
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Clone kernel
        run:
            git clone --depth=1 https://github.com/LineageOS/android_kernel_motorola_sm6225 kernel_workspace

      - name: Setup xxksu
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -
          cat <<EOF >> arch/arm64/configs/vendor/ext_config/devon-default.config

          #xxKernelSU

          CONFIG_KSU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y

          EOF

      - name: Build kernel
        run: |
          # export PATH=$GITHUB_WORKSPACE/clang/toolchain/bin:$GITHUB_WORKSPACE/kernel-build-tools/bin:$PATH
          export PATH=$GITHUB_WORKSPACE/clang/toolchain/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="clang"
          export LD=ld.lld
          export TARGET_BOARD_PLATFORM=bengal

          cd $GITHUB_WORKSPACE/kernel_workspace

          # ARGS="O=out ARCH=arm64 \
          #       CC=clang \
          #       CROSS_COMPILE=aarch64-none-linux-gnu- \
          #       CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          #       LLVM=1 LLVM_IAS=1"

          mkdir -p out
          make O=out vendor/bengal-perf_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-bengal.config
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/devon-default.config
          make O=out olddefconfig
          make O=out -j$(nproc)
          # make O=out -j$(nproc) $ARGS

      # - name: Upload build output
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: kernel-output
      #     path: |
      #       kernel_workspace/out/arch/arm64/boot/
      #       kernel_workspace/out/.config

      # - name: Package into AnyKernel3 Flashable ZIP
      #   run: |
      #     cd $GITHUB_WORKSPACE
      #     # cd $GITHUB_WORKSPACE/kernel_workspace
      #     # Clone standard AnyKernel3 template
      #     git clone --depth=1 https://github.com/MrIceT/anykernel3_wild.git anykernel
      #
      #     # Copy your freshly compiled Image into the AnyKernel folder
      #     cp $GITHUB_WORKSPACE/kernel_workspace/out/arch/arm64/boot/Image anykernel/
      #
      #     # Zip everything up
      #     cd anykernel
      #
      #     rm -rf .git

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel_workspace/out/arch/arm64/boot/

      # - name: Upload Flashable Kernel ZIP
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: devon_xxksu
      #     path: anykernel/


